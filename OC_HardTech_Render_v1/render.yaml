services:
  - type: web
    name: oc-hard-tech-landscape
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: Qwen/Qwen3-4B-Instruct-2507
      - key: LLM_TIMEOUT_SECONDS
        value: "45"
      - key: LLM_TOP_K
        value: "10"
